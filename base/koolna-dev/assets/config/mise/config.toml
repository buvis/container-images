[settings]
experimental = true

[tools]
node = "26.13.0"
# npm backend, not aqua: aqua resolves pnpm to a GitHub release asset
# (pnpm-linux-x64.tar.gz) that upstream does not publish, so every bump 404s.
"npm:pnpm" = "12.16.1"
deno = "2.9.8"
python = "3.14.10"
uv = "0.13.6"
ruff = "0.17.3"
poetry = "2.5.1"
rust = "1.99.1"
"cargo:zoxide" = "0.10.0"
"cargo:rumdl" = "0.3.2"
"pipx:buvis-gems" = { version = "0.16.0", extras = "all" }
"pipx:yt-dlp" = "2026.10.26"
"pipx:beets" = "2.14.1"
"pipx:gita" = "0.16.8.2"
"npm:@github/copilot" = "1.0.105"
"npm:pake-cli" = "3.17.8"
