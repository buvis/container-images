[settings]
experimental = true

[tools]
node = "26.13.1"
# npm backend, not aqua: aqua resolves pnpm to a GitHub release asset
# (pnpm-linux-x64.tar.gz) that upstream does not publish, so every bump 404s.
"npm:pnpm" = "12.18.0"
deno = "2.9.8"
python = "3.15.2"
uv = "0.13.7"
ruff = "0.17.4"
poetry = "2.5.1"
rust = "1.100.0"
"cargo:zoxide" = "0.10.0"
"cargo:rumdl" = "0.3.3"
"pipx:buvis-gems" = { version = "0.20.0", extras = "all" }
"pipx:yt-dlp" = "2026.10.26"
"pipx:beets" = "2.14.1"
"pipx:gita" = "0.16.8.2"
"npm:@github/copilot" = "1.0.107"
"npm:pake-cli" = "3.18.0"
